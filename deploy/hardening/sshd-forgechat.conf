# /etc/ssh/sshd_config.d/10-forgechat.conf — durcissement SSH (amélioration n° 17, 2026-10-12).
# Installé par deploy/hardening/install.sh, qui vérifie d'abord qu'un compte non-root avec clé
# et sudo existe (sinon vous seriez enfermé dehors) et valide la config avec `sshd -t`.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
PermitEmptyPasswords no
MaxAuthTries 3
MaxSessions 4
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
PermitUserEnvironment no
