# Site nginx de ForgeChat : copie de référence de /etc/nginx/sites-enabled/forgechat (nginx de l'HÔTE,
# pas de conteneur). Inclus dans le bloc http{} de /etc/nginx/nginx.conf, qui porte déjà
# `server_tokens off;`. Procédure d'application : docs/APPLIQUER-INFRA-2026-10-10.md.
#
# En-têtes de sécurité : snippets/security-headers.conf (HSTS, X-Frame-Options, nosniff,
# Referrer-Policy, Permissions-Policy), partagé avec les autres sites du VPS. nginx n'hérite PAS des
# add_header du niveau server dans une location qui définit les siens : chaque location qui a un
# add_header ré-inclut donc le snippet.

# Connexion, inscription, mot de passe oublié : 10 requêtes/min par IP (rafale 5), au niveau http.
limit_req_zone $binary_remote_addr zone=forgechat_auth:10m rate=10r/m;

server {
    server_name forgechat.heiphaistos.org;
    access_log off; # forgechat-anonymat

    root /opt/forgechat/client/dist;
    index index.html;
    include snippets/security-headers.conf;

    # Corps de requête : 1 Mo par défaut ; plus grand seulement sur les routes d'envoi de fichiers.
    client_max_body_size 1m;

    # En-têtes vers l'API, hérités par toute location qui n'en définit pas. L'IP vient de la
    # connexion TCP, jamais d'un en-tête envoyé par le client.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Assets hashés (JS/CSS/fonts) : cache long terme immuable
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control 'public, immutable';
        include snippets/security-headers.conf;
        try_files $uri =404;
    }

    # React SPA : no-store pour éviter crash après rebuild (hashes JS changent)
    # CSP (durcie le 2026-10-12, validée au banc dans Chromium : connexion, clés E2E, MP et salon chiffrés,
    # clé de récupération signée, pages principales, moteur d'IA — aucune violation) :
    # - script-src : ni 'unsafe-inline' ni 'unsafe-eval' ; 'wasm-unsafe-eval' pour WebAssembly ;
    # - connect-src : NOTRE origine seulement (API, WebSocket, LiveKit /livekit, modèles d'IA) — une XSS
    #   ne peut plus exfiltrer vers un autre site ;
    # - require-trusted-types-for 'script' : toute écriture de HTML ou d'adresse de script passe par la
    #   politique `default` de client/src/lib/trustedTypes.ts (texte, coloration highlight.js, scripts de
    #   notre origine, API YouTube) ; le reste est refusé par le navigateur ;
    # - frame-ancestors / base-uri 'none', COOP same-origin : ni encadrement, ni <base> injecté, ni
    #   accès d'une fenêtre ouvrante.
    location / {
        add_header Cache-Control 'no-store, no-cache, must-revalidate';
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.youtube.com https://s.ytimg.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' wss://forgechat.heiphaistos.org blob: data:; media-src 'self' blob: data:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; require-trusted-types-for 'script'; upgrade-insecure-requests; report-uri /api/security/csp-report; report-to csp" always;
        # Rapports de violation CSP / Trusted Types (amélioration n° 7) : Administration > Diagnostics.
        add_header Reporting-Endpoints 'csp="https://forgechat.heiphaistos.org/api/security/csp-report"' always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        include snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Divulgation responsable (RFC 9116, amélioration n° 23) : texte brut, jamais l'appli.
    location ^~ /.well-known/security {
        default_type text/plain;
        add_header Cache-Control "public, max-age=86400" always;
        include snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Modèles de l'IA sur l'appareil (docs/IA-SUR-APPAREIL.md) : statiques, empreintes vérifiées par l'appli.
    location ^~ /ai-models/ {
        alias /srv/forgechat-ai-models/;
        default_type application/octet-stream;
        types { application/wasm wasm; application/json json; }
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        include snippets/security-headers.conf;
    }

    # API REST
    location /api/ {
        proxy_pass http://127.0.0.1:3013;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    # Connexion, inscription, réinitialisation, 2FA : limitées par IP.
    location ~ ^/api/auth/(login|prelogin|register|verify-email|forgot-password|reset-password|panic|2fa/[a-z-]+)$ {
        limit_req zone=forgechat_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3013;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    # Pièces jointes (500 Mo par fichier + enveloppe : ATTACHMENT_BODY_LIMIT, server/src/main.rs).
    location ~ ^/api/.+/(attachments|forum-uploads)$ {
        client_max_body_size 1100M;
        client_body_timeout 300s;
        proxy_pass http://127.0.0.1:3013;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }

    # Images, sons, emojis, stickers (limite serveur par défaut : 12 Mo, server/src/main.rs).
    location ~ ^/api/(users/me/(avatar|banner|sounds)|servers/[^/]+/(icon|banner|emojis|stickers|soundboard|profile/[^/]+)|servers/[^/]+/roles/[^/]+/icon)$ {
        client_max_body_size 12m;
        proxy_pass http://127.0.0.1:3013;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    # Signalisation du serveur média LiveKit (SFU). Le média, lui, passe en UDP direct.
    location ^~ /livekit/ {
        proxy_pass http://127.0.0.1:7880/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # WebSocket
    location /ws {
        proxy_pass http://127.0.0.1:3013;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Uploads (servis par l'API avec leurs propres en-têtes)
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:3013;
        proxy_http_version 1.1;
    }

    # Invitations (public)
    location /invites/ {
        proxy_pass http://127.0.0.1:3013/api/invites/;
        proxy_http_version 1.1;
    }

    # Artefacts, manifestes et listes d'empreintes signées des applications (forgechat_releases_sync.py).
    # Dossier hors de /opt/forgechat : le rsync de deploy.sh ne doit pas y toucher.
    location ^~ /desktop/ {
        alias /var/www/forgechat-desktop/;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=300";
        include snippets/security-headers.conf;
    }

    # Downloads client desktop
    location ^~ /downloads/ {
        alias /opt/forgechat/downloads/;
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=86400";
        include snippets/security-headers.conf;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/forgechat.heiphaistos.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forgechat.heiphaistos.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = forgechat.heiphaistos.org) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name forgechat.heiphaistos.org;
    access_log off; # forgechat-anonymat
    return 404;
}
