[package]
name = "forgechat-desktop"
version = "3.24.0"
edition = "2021"

[lib]
name = "forgechat_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "forgechat-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-deep-link = "2"
# Push-to-talk global, actif fenetre non focalisee (correctif A9)
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Mise a jour automatique (src/updater.rs) : telechargement du manifeste et de
# l'artefact, puis verification de son empreinte AVANT installation.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset", "http2"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_Foundation",
    # ShellExecuteW : lancer l'installeur NSIS, qui exige l'elevation et ne peut
    # donc pas etre demarre par Command::spawn (ERROR_ELEVATION_REQUIRED).
    "Win32_UI_Shell",
] }

# Handler de permission média WebKitGTK (correctif S3). Version epinglee sur
# celle que wry 0.55 utilise : `PlatformWebview::inner()` rend un
# `webkit2gtk::WebView` de CETTE version exacte, une autre version donnerait
# deux types distincts et ne compilerait pas. Meme feature `v2_38` que wry.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
