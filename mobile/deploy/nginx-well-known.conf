# À ajouter dans le bloc `server { listen 443 ... }` de nginx.conf, AVANT `location /`.
# Copier les deux fichiers de deploy/well-known/ dans /usr/share/nginx/html/.well-known/
# (ex. via client/public/.well-known/ pour qu'ils soient inclus dans le build Vite).

location = /.well-known/apple-app-site-association {
    default_type application/json;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
}

location = /.well-known/assetlinks.json {
    default_type application/json;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
}
