plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.forgechat'
version = '1.0.0'

android {
  namespace "com.forgechat.callservice"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.17.0"
  // HeadlessJsTaskService (version alignée par le plugin Gradle de React Native).
  implementation "com.facebook.react:react-android"
}
