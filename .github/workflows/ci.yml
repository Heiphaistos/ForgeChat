# Vérifications à chaque push et pull request : client web, serveur Rust, application mobile.
# Aucune action tierce : seul `checkout` (épinglé par SHA, sans jeton persistant) ; Node et Rust
# sont préinstallés sur les runners ubuntu-24.04.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx eslint src --quiet
      - name: Tests unitaires
        run: |
          set -e
          for f in scripts/*.test.mjs; do echo "== $f"; node --test "$f"; done
      - run: npx vite build

  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo check --locked
      - run: cargo test --locked

  # Parcours réels contre un serveur local (Postgres + Redis jetables).
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [client, server]
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d # postgres:16
        env:
          POSTGRES_USER: forgechat
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: forgechat
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U forgechat" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0 # redis:8-alpine, même image que la production
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgres://forgechat:ci@127.0.0.1:5432/forgechat
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      # Clés jetables de test (32 octets fixes en base64), jamais celles de la prod.
      TOTP_ENC_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      EMAIL_ENC_KEY: AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI=
      # Le serveur écrit ses e-mails dans ce dossier au lieu de les envoyer (refusé avec un
      # FRONTEND_URL https) : les scripts y lisent le code de vérification (scripts/_auth.mjs).
      FORGECHAT_TEST_MAILBOX: /tmp/mails
      # news.api.mjs pose ses fils de forum directement en base.
      FORGECHAT_PSQL: postgres://forgechat:ci@127.0.0.1:5432/forgechat
      PORT: '58080'
      UPLOAD_DIR: /tmp/uploads
      FRONTEND_URL: http://localhost:5173
      FORGECHAT_API_URL: http://127.0.0.1:58080
      # Comptes de test en @test.local : le filtre des fournisseurs d'e-mail est coupé ici.
      FORGECHAT_EMAIL_DOMAINS: '*'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Construire et démarrer le serveur
        working-directory: server
        run: |
          mkdir -p /tmp/uploads "$FORGECHAT_TEST_MAILBOX"
          cargo build --locked
          ./target/debug/forgechat > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf "$FORGECHAT_API_URL/api/health" >/dev/null && exit 0; sleep 1; done
          cat /tmp/server.log; exit 1
      - run: npm ci --no-audit --no-fund
        working-directory: client
      # Les tests remettent à zéro les limites par IP (inscription, connexion) avec redis-cli (absent du runner).
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends redis-tools
      - name: Le premier compte devient administrateur, puis les inscriptions passent sur invitation
        working-directory: client
        run: |
          # Base vide : première inscription libre = administrateur du site (voir scripts/admin.api.mjs).
          node --experimental-strip-types scripts/admin.api.mjs
      - name: Parcours messagerie, communauté et fichiers chiffrés (inscription libre pour les comptes de test)
        working-directory: client
        run: |
          PGPASSWORD=ci psql -h 127.0.0.1 -U forgechat forgechat -c "UPDATE site_settings SET value='open' WHERE key='registration_mode'"
          for s in messaging community e2e-files friends news; do
            for p in 'register_attempts:*' 'login_attempts:*' 'prelogin_ip:*'; do
              redis-cli --scan --pattern "$p" | xargs -r redis-cli del >/dev/null
            done
            node --experimental-strip-types scripts/$s.api.mjs
          done

  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npx eslint src --quiet
      - run: npx jest --ci --no-watchman
