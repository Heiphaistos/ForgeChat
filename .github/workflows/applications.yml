# Construction et publication des applications ForgeChat.
#
#   tag mobile-vX.Y.Z  -> APK Android signé (clé ForgeChat) + IPA iOS (non signée, à installer
#                         par AltStore / SideStore / Sideloadly, sans compte Apple payant)
#   tag desktop-vX.Y.Z -> Windows (installeur + portable), Linux (.deb, .rpm, .pkg.tar.zst, AppImage), macOS
#
# Les jobs de build n'ont que `contents: read` : ils ne touchent jamais à la release. Ils transmettent
# leurs fichiers par artefact (conservé 1 jour) au seul job `release`, qui a `contents: write`, calcule
# SHA256SUMS.txt et crée une release BROUILLON en pré-version.
#
# La release n'est pas publiée par la CI : Momo télécharge les fichiers, vérifie et SIGNE
# SHA256SUMS.txt hors ligne (scripts/release-sign.mjs, clé jamais sur GitHub), envoie
# SHA256SUMS.txt.sig, puis publie la release (docs/PUBLICATION-SIGNEE.md). Le VPS
# (deploy/forgechat_releases_sync.py) n'accepte qu'une release dont la signature est valide, et les
# applications la revérifient elles-mêmes.
#
# Clé Android : secrets ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD de l'Environment
# `android-release`, limité aux tags mobile-v* (un workflow_dispatch android doit donc viser un tag :
# `gh workflow run applications.yml --ref mobile-vX.Y.Z -f tag=mobile-vX.Y.Z -f jobs=android`).
name: Applications

on:
  push:
    tags: ['mobile-v*', 'desktop-v*']
  # Essai manuel d'une partie des builds (sans publication) : version = celle du tag indiqué.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de référence (mobile-vX.Y.Z ou desktop-vX.Y.Z)'
        required: true
      jobs:
        description: 'Jobs à lancer, séparés par des espaces (android ios windows linux macos)'
        required: true
      abis:
        description: 'Android : architectures (ex. x86_64 pour tester sur émulateur)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: applications-${{ github.ref }}
  cancel-in-progress: false

env:
  FORGECHAT_URL: https://forgechat.heiphaistos.org

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.v.outputs.kind }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$TAG"
          kind="${tag%%-v*}"; version="${tag#*-v}"
          [[ "$kind" =~ ^(mobile|desktop)$ ]] || { echo "::error::tag invalide : $tag"; exit 1; }
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag invalide : $tag"; exit 1; }
          if [ "$kind" = mobile ]; then
            have=$(sed -nE "s/^const VERSION = '([0-9.]+)'.*/\1/p" mobile/app.config.ts)
            pkg=$(node -p "require('./mobile/package.json').version")
          else
            have=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
            pkg=$(sed -nE 's/^version = "([0-9.]+)"/\1/p' desktop/src-tauri/Cargo.toml | head -1)
          fi
          [ "$have" = "$version" ] && [ "$pkg" = "$version" ] || { echo "::error::$tag ne correspond pas aux fichiers ($have / $pkg)"; exit 1; }
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    if: needs.version.outputs.kind == 'mobile' && (github.event_name == 'push' || contains(inputs.jobs, 'android'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Seul job qui voit la clé de signature Android (Environment limité aux tags mobile-v*).
    environment: android-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - name: SDK Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null
      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/cle"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cle/forgechat.jks"
          printf '%s' "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/cle/password"
      - name: Build APK signé
        working-directory: mobile
        env:
          FORGECHAT_PUSH: 'off'
          FORGECHAT_KEY_ALIAS: forgechat
          FORGECHAT_ABIS: ${{ inputs.abis || 'arm64-v8a,armeabi-v7a' }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          export FORGECHAT_KEYSTORE="$RUNNER_TEMP/cle/forgechat.jks" FORGECHAT_KEYSTORE_PASSWORD_FILE="$RUNNER_TEMP/cle/password"
          ./scripts/build-apk-local.sh production --server "$FORGECHAT_URL"
          mkdir -p "$RUNNER_TEMP/out"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/ForgeChat-$VERSION.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$RUNNER_TEMP/out/"*.apk | grep -E "Signer #1 certificate (DN|SHA-256)"
      - name: Effacer la clé
        if: always()
        run: rm -rf "$RUNNER_TEMP/cle"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 1

  ios:
    needs: version
    if: needs.version.outputs.kind == 'mobile' && (github.event_name == 'push' || contains(inputs.jobs, 'ios'))
    # Expo SDK 57 exige Xcode 26.4+ (expo/expo#49426) : macos-15 s'arrête à 26.3.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Xcode le plus récent
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Build IPA (non signée)
        working-directory: mobile
        env:
          APP_ENV: production
          EXPO_PUBLIC_APP_ENV: production
          EXPO_NO_DOTENV: '1'
          NODE_ENV: production
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          export FORGECHAT_API_URL="$FORGECHAT_URL"
          node scripts/eas-build-pre-install.js
          npx expo prebuild --platform ios --clean
          # Installation hors App Store (AltStore, SideStore…) avec un identifiant Apple gratuit :
          # aucun droit réservé aux comptes payants (push APNs, domaines associés).
          for f in ios/*/*.entitlements; do
            printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0"><dict/></plist>\n' > "$f"
          done
          ws=$(ls -d ios/*.xcworkspace | head -1); scheme=$(basename "$ws" .xcworkspace)
          xcodebuild -workspace "$ws" -scheme "$scheme" -configuration Release -sdk iphoneos \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/fc.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > "$RUNNER_TEMP/xcode.log" 2>&1 || {
              set +o pipefail
              grep -n " error: \|error: " "$RUNNER_TEMP/xcode.log" | cut -c1-400 | head -40
              exit 1
            }
          mkdir -p "$RUNNER_TEMP/ipa/Payload" "$RUNNER_TEMP/out"
          cp -R "$RUNNER_TEMP/fc.xcarchive/Products/Applications/"*.app "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/out/ForgeChat-$VERSION.ipa" Payload)
      - name: Journal Xcode (échec)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcode-log
          path: ${{ runner.temp }}/xcode.log
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 1

  windows:
    needs: version
    if: needs.version.outputs.kind == 'desktop' && (github.event_name == 'push' || contains(inputs.jobs, 'windows'))
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Build
        shell: cmd
        run: cmd /d /c "%GITHUB_WORKSPACE%\desktop\build.bat" < NUL
      - name: Vérifier les artefacts
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: ls -la dist-desktop && test -f "dist-desktop/ForgeChat-Setup-v$VERSION.exe" && test -f "dist-desktop/ForgeChat-Portable-v$VERSION.exe"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: dist-desktop/*.exe
          if-no-files-found: error
          retention-days: 1

  linux:
    needs: version
    if: needs.version.outputs.kind == 'desktop' && (github.event_name == 'push' || contains(inputs.jobs, 'linux'))
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Dépendances (mêmes paquets que la machine de build WSL)
        env:
          # SHA-256 de https://apt.llvm.org/llvm.sh relevé le 2026-10-10. Si le script change, le build
          # échoue ici : relire le nouveau script, puis mettre à jour cette empreinte.
          LLVM_SH_SHA256: 03878e08f47b66cc95bc4b544b0db3c6d9ce8d60e6cf2492ae357984330a9eae
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -yq libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libasound2-dev libpulse-dev libdbus-1-dev \
            libx11-dev libxcomposite-dev libxdamage-dev libxext-dev libxfixes-dev libxrandr-dev libxtst-dev \
            libclang-dev libv4l-dev file patchelf rpm
          curl -fsSL --proto =https --tlsv1.2 https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          echo "$LLVM_SH_SHA256  $RUNNER_TEMP/llvm.sh" | sha256sum -c -
          sudo bash "$RUNNER_TEMP/llvm.sh" 21
          sudo apt-get install -yq libc++-21-dev libc++abi-21-dev
      - name: Build
        run: bash desktop/build.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux
          path: |
            dist-desktop/*.deb
            dist-desktop/*.rpm
            dist-desktop/*.AppImage
          if-no-files-found: error
          retention-days: 1

  # Arch, Omarchy, Manjaro : le .deb du job linux remis en paquet pacman (desktop/arch/PKGBUILD).
  arch:
    needs: [version, linux]
    if: needs.version.outputs.kind == 'desktop'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: archlinux:base-devel@sha256:996c3a1d6b0d87b01242f6fcd8cfa3ad3eece1a67ab5c8f108e20af1d7b97bdd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux
          path: dist-desktop
      - name: Paquet pacman
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # makepkg refuse de tourner en root.
          useradd -m build
          chown -R build dist-desktop
          runuser -u build -- bash desktop/arch/paquet.sh \
            "dist-desktop/ForgeChat-v$VERSION-amd64.deb" "dist-desktop/ForgeChat-v$VERSION-x86_64.pkg.tar.zst"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arch
          path: dist-desktop/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 1

  macos:
    needs: version
    if: needs.version.outputs.kind == 'desktop' && (github.event_name == 'push' || contains(inputs.jobs, 'macos'))
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Build universel (Apple Silicon + Intel)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          (cd client && npm ci --no-audit --no-fund && npm run build)
          cd desktop && npm ci --no-audit --no-fund
          npx tauri build --target universal-apple-darwin --bundles app,dmg
          b=src-tauri/target/universal-apple-darwin/release/bundle
          mkdir -p "$RUNNER_TEMP/out"
          cp "$b"/dmg/*.dmg "$RUNNER_TEMP/out/ForgeChat-v$VERSION-macos.dmg"
          tar -czf "$RUNNER_TEMP/out/ForgeChat-v$VERSION-macos.app.tar.gz" -C "$b/macos" ForgeChat.app
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 1

  # Seul job avec le droit d'écrire : rassemble les artefacts, calcule SHA256SUMS.txt, crée la release
  # brouillon. Ne publie pas : la signature se fait hors ligne (docs/PUBLICATION-SIGNEE.md).
  release:
    needs: [version, android, ios, windows, linux, arch, macos]
    # Les jobs de l'autre famille sont « skipped » : seul un échec bloque la publication.
    if: ${{ github.event_name == 'push' && !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: out
          merge-multiple: true
      - name: Release brouillon et SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ needs.version.outputs.kind }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cd out
          rm -f SHA256SUMS.txt SHA256SUMS.txt.sig xcode.log
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          notes="../release-notes/${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || notes=/dev/null
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Relance : les fichiers remplacés invalident toute signature déjà envoyée (le VPS refusera).
            gh release upload "$GITHUB_REF_NAME" ./* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" --draft --prerelease \
              --title "ForgeChat $KIND $VERSION" --notes-file "$notes"
          fi
