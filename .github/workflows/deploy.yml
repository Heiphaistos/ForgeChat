name: Deploy ForgeChat
# ci-test-v3

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 --decode --ignore-garbage > /tmp/dk
          chmod 600 /tmp/dk
          # Config SYSTÈME (indépendante du HOME variable des steps act)
          printf 'Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n  LogLevel ERROR\n' >> /etc/ssh/ssh_config

      - name: Debug SSH
        run: |
          echo "HOME=$HOME user=$(id -un)"
          which ssh; ssh -V
          tail -5 /etc/ssh/ssh_config
          ssh -vv -i /tmp/dk -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'echo REMOTE-OK' 2>&1 | tail -25 || true

      - name: Deploy to VPS via SSH
        run: |
          ssh -i /tmp/dk -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
            set -e
            cd /opt/forgechat
            git fetch origin
            git reset --hard origin/main
            cd client && npm ci && npm run build && cd ..
            docker compose up -d --build --remove-orphans
            echo "Deployed $(date)"
          '

      - name: Cleanup
        if: always()
        run: rm -f /tmp/dk
