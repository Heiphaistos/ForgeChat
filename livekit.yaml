# Serveur média LiveKit (SFU) de ForgeChat.
# Aucun secret ici : les clés arrivent par LIVEKIT_KEYS (docker-compose, depuis .env)
# et l'IP publique par NODE_IP.
port: 7880
logging:
  level: info
rtc:
  # Un seul port UDP multiplexé. Il doit être dans la plage UDP que le pare-feu
  # IONOS laisse passer (49152-65535, mesuré le 2026-09-22 : 7882 est bloqué).
  # coturn est borné à 65000 pour ne jamais prendre ce port.
  udp_port: 65100
  # Repli ICE/TCP quand l'UDP est filtré chez le client.
  tcp_port: 7881
  use_external_ip: false
  congestion_control:
    enabled: true
    allow_pause: true
room:
  # Salle détruite 60 s après le départ du dernier participant.
  empty_timeout: 60
  departure_timeout: 20
