services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: forgechat
      POSTGRES_USER: forgechat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgechat"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    ports:
      - "127.0.0.1:3013:8080"
    environment:
      DATABASE_URL: postgres://forgechat:${POSTGRES_PASSWORD}@postgres:5432/forgechat
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis}
      PORT: 8080
      UPLOAD_DIR: /app/uploads
      FRONTEND_URL: ${FRONTEND_URL:-https://forgechat.heiphaistos.org}
      RUST_LOG: forgechat=info,tower_http=warn
      JWT_ISSUER: ${JWT_ISSUER:-forgechat}
      TURN_URL: ${TURN_URL:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_PASSWORD: ${TURN_PASSWORD:-}
      TURN_STATIC_AUTH_SECRET: ${TURN_STATIC_AUTH_SECRET:-}
      FORGECHAT_DESKTOP_MANIFEST: ${FORGECHAT_DESKTOP_MANIFEST:-/app/desktop-releases/latest.json}
      FORGECHAT_DESKTOP_BASE_URL: ${FORGECHAT_DESKTOP_BASE_URL:-https://forgechat.heiphaistos.org/desktop}
      LIVEKIT_URL: ${LIVEKIT_URL:-wss://forgechat.heiphaistos.org/livekit}
      LIVEKIT_INTERNAL_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY requis}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET requis}
      # Web Push (facultatif : absent = push désactivé)
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Import de serveurs Discord (exports ArchiveForge) — server/src/handlers/discord_import
      ARCHIVEFORGE_URL: ${ARCHIVEFORGE_URL:-https://forgearchive.heiphaistos.org}
      DISCORD_IMPORT_MAX_BYTES: ${DISCORD_IMPORT_MAX_BYTES:-21474836480}
      # Comptes autorises a lire les rapports d'erreurs (UUID separes par des virgules)
      FORGECHAT_ADMIN_USER_IDS: ${FORGECHAT_ADMIN_USER_IDS:-}
    volumes:
      - uploads:/app/uploads
      # Artefacts et manifeste des applications de bureau, deposes sur l'hote.
      # En lecture seule : le serveur ne fait que lire le manifeste.
      - /var/www/forgechat-desktop:/app/desktop-releases:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8080/health > /dev/null 2>&1"]
      interval: 10s
      retries: 5
      start_period: 30s

  # Serveur média (SFU) : tout le son et la vidéo transitent par lui, plus aucun
  # pair-à-pair. Signalisation derrière nginx (/livekit/), média en UDP direct.
  livekit:
    image: livekit/livekit-server:v1.13.7
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      NODE_IP: ${LIVEKIT_NODE_IP:?LIVEKIT_NODE_IP requis (IP publique du VPS)}
      # Configuration complète ici plutôt que dans un fichier : LiveKit ne lit
      # qu'UNE source (fichier OU LIVEKIT_CONFIG), et le webhook doit nommer la
      # clé d'API, qui vient de .env. Aucun secret dans ce texte.
      LIVEKIT_CONFIG: |
        port: 7880
        logging:
          level: info
        rtc:
          # Un seul port UDP multiplexé, dans la plage que le pare-feu IONOS
          # laisse passer (49152-65535, mesuré : 7882 est bloqué). coturn est
          # borné à 65000 pour ne jamais le prendre.
          udp_port: 65100
          # Repli ICE/TCP quand l'UDP est filtré chez le client.
          tcp_port: 7881
          use_external_ip: false
          congestion_control:
            enabled: true
            allow_pause: true
        room:
          empty_timeout: 60
          departure_timeout: 20
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://server:8080/api/livekit/webhook
    ports:
      - "127.0.0.1:7880:7880"
      - "7881:7881"
      - "65100:65100/udp"
    restart: unless-stopped

volumes:
  pgdata:
    external: true
    name: forgechat_forgechat_pgdata
  uploads:
