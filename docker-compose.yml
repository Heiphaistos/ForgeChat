# Journaux Docker bornés (10 Mo x 3 par service) : rien ne s'accumule indéfiniment.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    # Images épinglées par empreinte (celles qui tournaient en production le 2026-10-10) : une mise à jour
    # est un changement explicite de cette ligne, jamais une surprise au redémarrage.
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    logging: *logging
    environment:
      POSTGRES_DB: forgechat
      POSTGRES_USER: forgechat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgechat"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    logging: *logging
    restart: unless-stopped
    # Aucune persistance : compteurs anti-abus et jetons éphémères ne survivent pas à un redémarrage.
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  server:
    logging: *logging
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    ports:
      - "127.0.0.1:3013:8080"
    environment:
      DATABASE_URL: postgres://forgechat:${POSTGRES_PASSWORD}@postgres:5432/forgechat
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis}
      TOTP_ENC_KEY: ${TOTP_ENC_KEY:?TOTP_ENC_KEY requis (openssl rand -base64 32)}
      EMAIL_ENC_KEY: ${EMAIL_ENC_KEY:?EMAIL_ENC_KEY requis (openssl rand -base64 32)}
      PORT: 8080
      UPLOAD_DIR: /app/uploads
      FRONTEND_URL: ${FRONTEND_URL:-https://forgechat.heiphaistos.org}
      RUST_LOG: forgechat=info,tower_http=warn
      JWT_ISSUER: ${JWT_ISSUER:-forgechat}
      # Mails (reinitialisation du mot de passe) : absent = pas d'envoi
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@forgechat.heiphaistos.org}
      STUN_URLS: ${STUN_URLS:-}
      TURN_URL: ${TURN_URL:-}
      TURN_STATIC_AUTH_SECRET: ${TURN_STATIC_AUTH_SECRET:-}
      FORGECHAT_DESKTOP_MANIFEST: ${FORGECHAT_DESKTOP_MANIFEST:-/app/desktop-releases/latest.json}
      FORGECHAT_DESKTOP_BASE_URL: ${FORGECHAT_DESKTOP_BASE_URL:-https://forgechat.heiphaistos.org/desktop}
      LIVEKIT_URL: ${LIVEKIT_URL:-wss://forgechat.heiphaistos.org/livekit}
      LIVEKIT_INTERNAL_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY requis}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET requis}
      # Web Push (facultatif : absent = push désactivé)
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Push de l'app mobile via Expo (facultatif : false = désactivé)
      PUSH_ENABLED: ${PUSH_ENABLED:-false}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      # Import de serveurs Discord (exports ArchiveForge) — server/src/handlers/discord_import
      ARCHIVEFORGE_URL: ${ARCHIVEFORGE_URL:-https://forgearchive.heiphaistos.org}
      DISCORD_IMPORT_MAX_BYTES: ${DISCORD_IMPORT_MAX_BYTES:-21474836480}
      # Proprietaire du site : seul a pouvoir attribuer le role El Patron (administration, rapports d'erreurs, signalements).
      # Obligatoire, aucune valeur par defaut dans le depot.
      FORGECHAT_ADMIN_EMAIL: ${FORGECHAT_ADMIN_EMAIL:?FORGECHAT_ADMIN_EMAIL requis (e-mail du proprietaire du site)}
      # GIF : GIPHY, sinon KLIPY, sinon Wikimedia Commons (sans clé)
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      GIPHY_RATING: ${GIPHY_RATING:-pg-13}
      KLIPY_API_KEY: ${KLIPY_API_KEY:-}
      KLIPY_CONTENT_FILTER: ${KLIPY_CONTENT_FILTER:-medium}
    volumes:
      - uploads:/app/uploads
      # Artefacts et manifeste des applications de bureau, deposes sur l'hote.
      # En lecture seule : le serveur ne fait que lire le manifeste.
      - /var/www/forgechat-desktop:/app/desktop-releases:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # /api/health (il n'existe pas de route /health) ; -f : un code d'erreur HTTP rend le conteneur malade.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      retries: 5
      start_period: 30s

  # Serveur média (SFU) : tout le son et la vidéo transitent par lui, plus aucun
  # pair-à-pair. Signalisation derrière nginx (/livekit/), média en UDP direct.
  livekit:
    image: livekit/livekit-server:v1.13.7@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3
    logging: *logging
    # Pas de root : aucun volume, ports tous au-dessus de 1024.
    user: "65534:65534"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      NODE_IP: ${LIVEKIT_NODE_IP:?LIVEKIT_NODE_IP requis (IP publique du VPS)}
      # Configuration complète ici plutôt que dans un fichier : LiveKit ne lit
      # qu'UNE source (fichier OU LIVEKIT_CONFIG), et le webhook doit nommer la
      # clé d'API, qui vient de .env. Aucun secret dans ce texte.
      LIVEKIT_CONFIG: |
        port: 7880
        logging:
          level: warn
        rtc:
          # Un seul port UDP multiplexé, dans la plage que le pare-feu IONOS
          # laisse passer (49152-65535, mesuré : 7882 est bloqué). coturn est
          # borné à 65000 pour ne jamais le prendre.
          udp_port: 65100
          # Repli ICE/TCP quand l'UDP est filtré chez le client.
          tcp_port: 7881
          use_external_ip: false
          congestion_control:
            enabled: true
            allow_pause: true
        room:
          empty_timeout: 60
          departure_timeout: 20
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://server:8080/api/livekit/webhook
    ports:
      - "127.0.0.1:7880:7880"
      - "7881:7881"
      - "65100:65100/udp"
    restart: unless-stopped

volumes:
  pgdata:
    external: true
    name: forgechat_forgechat_pgdata
  uploads:
