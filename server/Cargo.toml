[package]
name = "forgechat-server"
version = "3.303.0"
edition = "2021"

[[bin]]
name = "forgechat"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws", "multipart", "macros"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs", "trace", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.1", features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bcrypt = "0.15"
# Sans fonctionnalité de chiffrement (`rust_crypto` tirait `rsa`, RUSTSEC-2023-0071) : HS256 via src/jwt.rs.
jsonwebtoken = { version = "10.3", default-features = false }
redis = { version = "0.24", features = ["tokio-comp", "aio", "connection-manager"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
anyhow = "1"
thiserror = "1"
bytes = "1"
rand = "0.8"
base64 = "0.22"
mime_guess = "2"
tokio-stream = "0.1"
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
# Secret TOTP chiffré au repos (déjà présent via web-push-native).
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
totp-lite = "2"
data-encoding = "2.6"
urlencoding = "2"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# Web Push (aes128gcm) en Rust pur : la crate `web-push` tire `ece` -> openssl. Jeton VAPID signé
# dans push.rs (ES256 via p256) : la fonctionnalité `vapid` tirait jwt-simple -> superboring -> rsa.
web-push-native = { version = "0.5", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }

[profile.release]
opt-level = 3
lto = true
